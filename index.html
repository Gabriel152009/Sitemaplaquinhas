<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plaquê · Gestão de Plaquinhas QR/NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-900:#0B1730;
    --navy-800:#0F1F3D;
    --navy-700:#16294F;
    --navy-600:#1E3563;
    --green-600:#159A52;
    --green-500:#1FAA59;
    --green-100:#E4F7EC;
    --white:#FFFFFF;
    --surface:#F3F6FB;
    --surface-2:#EAEFF7;
    --ink-900:#101828;
    --ink-600:#4B5768;
    --ink-400:#8593A6;
    --border:#E1E7F0;
    --red-600:#D6304A;
    --red-100:#FCE8EB;
    --amber-600:#B6790A;
    --amber-100:#FBF0DD;
    --radius:12px;
    --radius-sm:8px;
    --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-pop:0 12px 32px rgba(11,23,48,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--surface);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.font-head{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app{min-height:100vh;}
  ::selection{background:var(--green-100);}

  /* ---------- Utility ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    padding:10px 16px;border-radius:9px;border:1px solid transparent;
    font-size:14px;font-weight:600;transition:all .15s ease;white-space:nowrap;
  }
  .btn-primary{background:var(--navy-800);color:#fff;}
  .btn-primary:hover{background:var(--navy-700);}
  .btn-accent{background:var(--green-500);color:#fff;}
  .btn-accent:hover{background:var(--green-600);}
  .btn-ghost{background:transparent;color:var(--ink-600);border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink-900);}
  .btn-danger-ghost{background:transparent;color:var(--red-600);border-color:var(--red-100);}
  .btn-danger-ghost:hover{background:var(--red-100);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-icon{width:34px;height:34px;padding:0;border-radius:8px;}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .badge-green{background:var(--green-100);color:var(--green-600);}
  .badge-red{background:var(--red-100);color:var(--red-600);}
  .badge-amber{background:var(--amber-100);color:var(--amber-600);}
  .badge-gray{background:var(--surface-2);color:var(--ink-600);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-900);margin-bottom:6px;}
  .field .hint{font-size:12px;color:var(--ink-400);margin-top:5px;}
  .field .err{font-size:12px;color:var(--red-600);margin-top:5px;}
  .input, select.input, textarea.input{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;color:var(--ink-900);background:#fff;outline:none;transition:border-color .15s;
  }
  .input:focus{border-color:var(--navy-600);box-shadow:0 0 0 3px rgba(30,53,99,.1);}
  .input.invalid{border-color:var(--red-600);}
  textarea.input{resize:vertical;min-height:78px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.row-2{grid-template-columns:1fr;}}

  .toast-wrap{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--navy-900);color:#fff;padding:12px 16px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:10px;animation:slidein .2s ease;max-width:320px;}
  .toast.success{background:var(--green-600);}
  .toast.error{background:var(--red-600);}
  @keyframes slidein{from{transform:translateX(16px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  .modal-backdrop{position:fixed;inset:0;background:rgba(11,23,48,.5);display:flex;align-items:center;justify-content:center;z-index:9000;padding:16px;}
  .modal{background:#fff;border-radius:14px;max-width:480px;width:100%;padding:24px;box-shadow:var(--shadow-pop);max-height:90vh;overflow:auto;}
  .modal h3{margin:0 0 6px;}
  .modal .sub{color:var(--ink-600);font-size:13.5px;margin-bottom:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;}
  .login-brand{
    flex:1.1;background:linear-gradient(155deg,var(--navy-900),var(--navy-700) 70%);
    color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:52px 56px;position:relative;overflow:hidden;
  }
  .login-brand::after{
    content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(31,170,89,.28),transparent 70%);
  }
  .brand-mark{display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans';font-weight:700;font-size:19px;position:relative;z-index:1;}
  .brand-mark .tagchip{width:30px;height:30px;border-radius:8px;background:var(--green-500);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);}
  .login-headline{position:relative;z-index:1;max-width:420px;}
  .login-headline h1{font-size:32px;line-height:1.25;margin:0 0 14px;}
  .login-headline p{color:#C4CFE3;font-size:14.5px;line-height:1.6;}
  .qr-scatter{position:relative;z-index:1;display:flex;gap:10px;opacity:.85;}
  .qr-scatter .chip{font-size:11.5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 11px;border-radius:7px;color:#DCE4F2;}
  .login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;background:#fff;}
  .login-form-box{width:100%;max-width:360px;}
  .login-form-box h2{margin:0 0 6px;font-size:23px;}
  .login-form-box .sub{color:var(--ink-600);font-size:13.5px;margin-bottom:26px;}
  .demo-creds{margin-top:22px;padding:12px 14px;background:var(--surface);border-radius:9px;font-size:12.3px;color:var(--ink-600);line-height:1.7;}
  .demo-creds b{color:var(--ink-900);}
  @media (max-width:860px){.login-brand{display:none;}}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;background:var(--navy-900);color:#fff;flex-shrink:0;display:flex;flex-direction:column;
    position:fixed;top:0;left:0;bottom:0;z-index:500;transition:transform .2s ease;
  }
  .sidebar-top{padding:22px 20px 18px;}
  .sidebar nav{flex:1;padding:6px 12px;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#AEB9D1;
    font-size:14px;font-weight:600;margin-bottom:3px;border-left:3px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-item.active{background:rgba(31,170,89,.14);color:#fff;border-left-color:var(--green-500);}
  .nav-item svg{flex-shrink:0;}
  .sidebar-user{padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);}
  .sidebar-user .who{font-size:13px;font-weight:700;}
  .sidebar-user .role{font-size:11.5px;color:#8FA0C4;margin-top:1px;}
  .sidebar-user button{margin-top:10px;width:100%;}
  .main{flex:1;margin-left:236px;min-width:0;}
  .topbar{
    background:#fff;border-bottom:1px solid var(--border);padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;
  }
  .topbar h1{font-size:19px;margin:0;}
  .topbar .crumb{font-size:12.5px;color:var(--ink-400);margin-bottom:2px;}
  .hamburger{display:none;background:none;border:none;padding:6px;}
  .content{padding:26px 28px 60px;max-width:1280px;}
  @media (max-width:960px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .hamburger{display:inline-flex;}
    .content{padding:18px 16px 50px;}
    .topbar{padding:14px 16px;}
  }
  .overlay{position:fixed;inset:0;background:rgba(11,23,48,.45);z-index:400;display:none;}
  .overlay.show{display:block;}

  /* ---------- Dashboard ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
  @media (max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.stat-grid{grid-template-columns:1fr 1fr;}}
  .stat-card{padding:18px;}
  .stat-card .label{font-size:12.5px;color:var(--ink-600);font-weight:600;}
  .stat-card .value{font-size:27px;font-weight:800;font-family:'Plus Jakarta Sans';margin-top:6px;}
  .stat-card .sub{font-size:11.5px;color:var(--ink-400);margin-top:4px;}
  .dash-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;}
  @media (max-width:900px){.dash-cols{grid-template-columns:1fr;}}
  .panel{padding:20px;margin-bottom:18px;}
  .panel h3{margin:0 0 3px;font-size:15.5px;}
  .panel .panel-sub{font-size:12.5px;color:var(--ink-400);margin-bottom:16px;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{width:100%;max-width:26px;background:linear-gradient(180deg,var(--green-500),var(--green-600));border-radius:5px 5px 0 0;min-height:3px;}
  .bar-lbl{font-size:10px;color:var(--ink-400);margin-top:6px;}
  .top-list{list-style:none;margin:0;padding:0;}
  .top-list li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .top-list li:last-child{border-bottom:none;}
  .top-list .rank{width:22px;height:22px;border-radius:6px;background:var(--surface-2);color:var(--ink-600);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:9px;}
  .top-list .info{display:flex;align-items:center;min-width:0;}
  .top-list .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-list .cnt{font-weight:700;color:var(--navy-800);flex-shrink:0;}

  /* ---------- Toolbar / table ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
  .toolbar .input{width:auto;min-width:0;}
  .toolbar .search{flex:1;min-width:180px;}
  .toolbar-right{margin-left:auto;display:flex;gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-size:11.5px;text-transform:none;color:var(--ink-400);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface);}
  .code-chip{font-family:'Plus Jakarta Sans';font-weight:700;letter-spacing:.5px;background:var(--surface-2);padding:3px 8px;border-radius:6px;font-size:12.5px;}
  .link-ellipsis{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;color:var(--ink-600);vertical-align:middle;}
  .actions-cell{display:flex;gap:4px;flex-wrap:nowrap;}
  .table-scroll{overflow-x:auto;}
  .pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:13px;color:var(--ink-600);}
  .pagination .pg-btns{display:flex;gap:6px;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-600);}
  .empty-state .icon{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .empty-state h3{margin:0 0 6px;color:var(--ink-900);}
  .loading-row{padding:40px;text-align:center;color:var(--ink-400);font-size:13.5px;}

  /* ---------- Detail / form pages ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-600);margin-bottom:14px;}
  .back-link:hover{color:var(--navy-800);}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .detail-head h2{margin:0 0 4px;}
  .detail-head .meta{color:var(--ink-600);font-size:13.5px;}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .detail-grid{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start;}
  @media (max-width:840px){.detail-grid{grid-template-columns:1fr;}}
  .qr-box{padding:22px;text-align:center;}
  .qr-box img{width:190px;height:190px;border-radius:10px;border:1px solid var(--border);padding:8px;background:#fff;}
  .url-line{display:flex;align-items:center;gap:8px;background:var(--surface);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-top:14px;word-break:break-all;text-align:left;color:var(--ink-600);}
  .qr-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
  .info-list{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;}
  @media (max-width:640px){.info-list{grid-template-columns:1fr;}}
  .info-item .lbl{font-size:11.5px;color:var(--ink-400);font-weight:700;margin-bottom:3px;}
  .info-item .val{font-size:14px;color:var(--ink-900);}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width:640px){.kpi-row{grid-template-columns:1fr 1fr;}}
  .kpi{background:var(--surface);border-radius:10px;padding:13px 15px;}
  .kpi .n{font-size:20px;font-weight:800;font-family:'Plus Jakarta Sans';}
  .kpi .l{font-size:11.5px;color:var(--ink-600);margin-top:2px;}

  /* ---------- Public redirect page ---------- */
  .public-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy-900);padding:20px;}
  .public-card{background:#fff;border-radius:16px;padding:40px 34px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-pop);}
  .public-icon{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--green-500);animation:spin .8s linear infinite;margin:0 auto 18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .demo-banner{margin-top:22px;background:var(--surface);border-radius:9px;padding:11px 13px;font-size:11.8px;color:var(--ink-600);text-align:left;line-height:1.6;}

  .switch{position:relative;width:38px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#CBD3E1;border-radius:999px;transition:.15s;}
  .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--green-500);}
  input:checked + .slider:before{transform:translateX(16px);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   PLAQUÊ — Sistema de gestão de plaquinhas QR/NFC
   Dados e login persistidos em um banco de dados real (Supabase).
   Configure SUPABASE_URL e SUPABASE_ANON_KEY abaixo antes de publicar.
   ========================================================================= */

const SUPABASE_URL = 'https://nyqxpehizsnusmksbske.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nYFDnsQLD3ZrmzzKSH93yA_pIyoAR-k';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const FAKE_DOMAIN = 'Gabriel.github.io/PlaquinhasNfc';
const QR_API = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=';

let DB = {sellers:[], plaques:[], scans:[], profiles:[]};
let currentUser = null;
let sidebarOpen = false;
const scanThrottle = {}; // code -> [timestamps] (rate limit em memória, por sessão do navegador)

/* ---------------------------- utils ---------------------------- */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(iso){ return new Date(iso).toLocaleDateString('pt-BR'); }
function daysAgo(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d; }
function isWithinDays(iso, n){ return new Date(iso) >= daysAgo(n-1); }
function isToday(iso){ const d=new Date(iso), t=new Date(); return d.toDateString()===t.toDateString(); }
function genCode(){
  const charset = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sem 0/O/1/I/L para evitar ambiguidade
  let code;
  do{
    code = Array.from({length:6}, () => charset[Math.floor(Math.random()*charset.length)]).join('');
  } while(DB.plaques.some(p => p.uniqueCode === code));
  return code;
}
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2800);
}
function isValidDestUrl(type, value){
  if(!value || !value.trim()) return false;
  if(type === 'pix') return value.trim().length > 3;
  try{
    const u = new URL(value.trim());
    return u.protocol === 'http:' || u.protocol === 'https:';
  }catch(e){ return false; }
}
function detectDevice(ua){ return /mobi|android|iphone|ipad/i.test(ua) ? 'Celular' : 'Computador'; }
function detectBrowser(ua){
  if(/edg/i.test(ua)) return 'Edge';
  if(/chrome/i.test(ua) && !/edg/i.test(ua)) return 'Chrome';
  if(/firefox/i.test(ua)) return 'Firefox';
  if(/safari/i.test(ua) && !/chrome/i.test(ua)) return 'Safari';
  return 'Outro';
}

/* ---------------------------- mapeamento (snake_case -> camelCase) ---------------------------- */
function mapSeller(r){ return {id:r.id, nome:r.nome, telefone:r.telefone, status:r.status, createdAt:r.created_at}; }
function mapPlaque(r){
  return {
    id:r.id, uniqueCode:r.unique_code, clientName:r.client_name, businessName:r.business_name,
    productType:r.product_type, destinationType:r.destination_type, destinationUrl:r.destination_url,
    sellerId:r.seller_id, notes:r.notes, status:r.status, createdAt:r.created_at, updatedAt:r.updated_at,
  };
}
function mapScan(r){ return {id:r.id, plaqueId:r.plaque_id, scannedAt:r.scanned_at, userAgent:r.user_agent, referrer:r.referrer, device:r.device, browser:r.browser}; }

/* ---------------------------- carregamento de dados (Supabase) ---------------------------- */
async function loadCurrentUserProfile(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ currentUser = null; return; }
  const {data: profile, error} = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile || profile.status !== 'ativo'){
    currentUser = null;
    await sb.auth.signOut();
    return;
  }
  currentUser = {id: profile.id, nome: profile.nome || profile.email, email: profile.email, role: profile.role, sellerId: profile.seller_id, status: profile.status};
}
async function loadAppData(){
  const [sellersRes, plaquesRes, scansRes] = await Promise.all([
    sb.from('sellers').select('*').order('created_at'),
    sb.from('plaques').select('*').order('created_at', {ascending:false}),
    sb.from('scans').select('*'),
  ]);
  DB.sellers = (sellersRes.data || []).map(mapSeller);
  DB.plaques = (plaquesRes.data || []).map(mapPlaque);
  DB.scans = (scansRes.data || []).map(mapScan);
  if(currentUser && currentUser.role === 'administrador'){
    const {data: profilesData} = await sb.from('profiles').select('*');
    DB.profiles = profilesData || [];
  } else {
    DB.profiles = [];
  }
}

/* ---------------------------- domain helpers ---------------------------- */
function sellerName(id){ const s = DB.sellers.find(x=>x.id===id); return s ? s.nome : '—'; }
function plaqueScans(id){ return DB.scans.filter(s=>s.plaqueId===id); }
function visiblePlaques(){
  if(currentUser.role === 'administrador') return DB.plaques;
  return DB.plaques.filter(p => p.sellerId === currentUser.sellerId);
}
function dynamicUrl(code){ return 'https://' + FAKE_DOMAIN + '/#/r/' + code; }
function destTypeLabel(t){
  return {whatsapp:'WhatsApp', instagram:'Instagram', google_avaliacoes:'Google Avaliações', cardapio:'Cardápio', site:'Site', pix:'Pix', personalizado:'Link personalizado'}[t] || t;
}

/* ---------------------------- router ---------------------------- */
function route(){ return location.hash || '#/dashboard'; }
window.addEventListener('hashchange', render);

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    await loadCurrentUserProfile();
    if(currentUser) await loadAppData();
  }
  render();
}

function render(){
  const hash = route();

  // rota pública, não exige login
  if(hash.startsWith('#/r/')){
    renderPublicRedirect(hash.slice(4));
    return;
  }

  if(!currentUser){
    renderLogin();
    return;
  }
  if(hash.startsWith('#/plaquinhas/novo')) return renderPlaqueForm(null);
  if(/^#\/plaquinhas\/[^\/]+\/editar/.test(hash)) return renderPlaqueForm(hash.split('/')[2]);
  if(/^#\/plaquinhas\/[^\/]+$/.test(hash)) return renderPlaqueDetail(hash.split('/')[2]);
  if(hash.startsWith('#/plaquinhas')) return renderPlaquesList();
  if(hash.startsWith('#/vendedores')) return renderSellers();
  return renderDashboard();
}

async function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const senha = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';

/* ============================== DASHBOARD ============================== */
function renderDashboard(){
  const plaques = visiblePlaques();
  const plaqueIds = new Set(plaques.map(p=>p.id));
  const scans = DB.scans.filter(s => plaqueIds.has(s.plaqueId));
  const ativas = plaques.filter(p=>p.status==='ativa').length;
  const inativas = plaques.length - ativas;
  const total7 = scans.filter(s=>isWithinDays(s.scannedAt,7)).length;

  // últimos 14 dias
  const days = [];
  for(let i=13;i>=0;i--){
    const d = daysAgo(i);
    const count = scans.filter(s => new Date(s.scannedAt).toDateString() === d.toDateString()).length;
    days.push({d, count});
  }
  const max = Math.max(1, ...days.map(x=>x.count));

  const top = [...plaques].map(p => ({p, count: plaqueScans(p.id).length}))
    .sort((a,b)=>b.count-a.count).slice(0,5);

  const body = `
    <div class="stat-grid">
      <div class="card stat-card"><div class="label">Total de plaquinhas</div><div class="value">${plaques.length}</div><div class="sub">cadastradas${currentUser.role==='vendedor'?' por você':''}</div></div>

      <div class="card stat-card"><div class="label">Inativas</div><div class="value" style="color:var(--red-600)">${inativas}</div><div class="sub">QR temporariamente desligado</div></div>
      <div class="card stat-card"><div class="label">Total de acessos</div><div class="value">${scans.length}</div><div class="sub">desde o início</div></div>
      <div class="card stat-card"><div class="label">Acessos (7 dias)</div><div class="value">${total7}</div><div class="sub">últimos 7 dias</div></div>
    </div>
    <div class="dash-cols">
      <div class="card panel">
        <h3>Acessos por dia</h3>
        <div class="panel-sub">Últimos 14 dias, todas as plaquinhas visíveis para você</div>
        <div class="bars">
          ${days.map(x => `<div class="bar-col"><div class="bar" style="height:${Math.max(4,(x.count/max)*130)}px" title="${x.count} acessos"></div><div class="bar-lbl">${x.d.getDate()}/${x.d.getMonth()+1}</div></div>`).join('')}
        </div>
      </div>
      <div class="card panel">
        <h3>Mais acessadas</h3>
        <div class="panel-sub">Ranking geral de acessos</div>
        ${top.length===0 ? '<div style="color:var(--ink-400);font-size:13.5px;">Nenhum acesso registrado ainda.</div>' : `
        <ul class="top-list">
          ${top.map((t,i)=>`
            <li>
              <div class="info"><span class="rank">${i+1}</span><span class="name">${escapeHtml(t.p.businessName)}</span></div>
              <span class="cnt">${t.count}</span>
            </li>`).join('')}
        </ul>`}
      </div>
    </div>
  `;
  mountPage('dashboard', 'Dashboard', null, body, `<a class="btn btn-accent" href="#/plaquinhas/novo">${iconSvg('plus')} Nova plaquinha</a>`);
}

  let plaques = visiblePlaques();

  if(listState.search.trim()){
    const q = listState.search.trim().toLowerCase();
    plaques = plaques.filter(p => p.clientName.toLowerCase().includes(q) || p.businessName.toLowerCase().includes(q) || p.uniqueCode.toLowerCase().includes(q));
  }
  if(listState.status) plaques = plaques.filter(p=>p.status===listState.status);
  if(listState.seller) plaques = plaques.filter(p=>p.sellerId===listState.seller);
  if(listState.product) plaques = plaques.filter(p=>p.productType===listState.product);

  plaques = [...plaques];
  if(listState.sort==='recent') plaques.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(listState.sort==='oldest') plaques.sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
  if(listState.sort==='most_scanned') plaques.sort((a,b)=> plaqueScans(b.id).length - plaqueScans(a.id).length);
  if(listState.sort==='az') plaques.sort((a,b)=> a.businessName.localeCompare(b.businessName));

  const totalPages = Math.max(1, Math.ceil(plaques.length / listState.pageSize));
  listState.page = Math.min(listState.page, totalPages);
  const pageItems = plaques.slice((listState.page-1)*listState.pageSize, listState.page*listState.pageSize);

        <select class="input" style="width:170px;" onchange="listState.sort=this.value; renderPlaquesList()">
          <option value="recent" ${listState.sort==='recent'?'selected':''}>Mais recentes</option>
          <option value="oldest" ${listState.sort==='oldest'?'selected':''}>Mais antigas</option>
          <option value="most_scanned" ${listState.sort==='most_scanned'?'selected':''}>Mais acessadas</option>
          <option value="az" ${listState.sort==='az'?'selected':''}>Nome A-Z</option>

      </div>
      ${pageItems.length === 0 ? `
        <div class="empty-state">
          <div class="icon">${iconSvg('tag').replace(/currentColor/g,'#8593A6')}</div>

          <div style="font-size:13.5px;">Ajuste os filtros ou cadastre a primeira plaquinha.</div>
        </div>
      ` : `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Código</th><th>Cliente</th><th>Estabelecimento</th><th>Produto</th><th>Destino</th><th>Status</th><th>Acessos</th><th>Criada em</th>${currentUser.role==='administrador'?'<th>Vendedor</th>':''}<th>Ações</th>

function copyPlaqueUrl(code){

function confirmToggleStatus(id){

async function toggleStatus(id){
  const p = DB.plaques.find(x=>x.id===id);

async function handleSavePlaque(e, id){
  e.preventDefault();
  const destType = document.getElementById('f_destType').value;
  let destUrl, waPhone=null, waMessage=null;

  if(destType === 'whatsapp'){
    waPhone = document.getElementById('f_waPhone').value.replace(/\\D/g,'');
    waMessage = document.getElementById('f_waMessage').value.trim();
    if(waPhone.length < 10){ toast('Informe um telefone válido com DDD.', 'error'); return false; }
    destUrl = `https://wa.me/55${waPhone}` + (waMessage ? `?text=${encodeURIComponent(waMessage)}` : '');
  } else {
    destUrl = document.getElementById('f_destUrl').value.trim();
    const errBox = document.getElementById('destUrlErr');
    if(!isValidDestUrl(destType, destUrl)){
      errBox.textContent = destType==='pix' ? 'Informe um link ou código Pix válido.' : 'Informe uma URL válida iniciando com http:// ou https://';
      errBox.style.display = 'block';
      document.getElementById('f_destUrl').classList.add('invalid');
      return false;
    }
  }

  const payload = {
    client_name: document.getElementById('f_clientName').value.trim(),
    business_name: document.getElementById('f_businessName').value.trim(),
    product_type: document.getElementById('f_productType').value,
    destination_type: destType,
    destination_url: destUrl,
    seller_id: document.getElementById('f_sellerId').value,
    notes: document.getElementById('f_notes').value.trim(),
  };

  if(id){
    payload.status = document.getElementById('f_status') ? document.getElementById('f_status').value : undefined;
    payload.updated_at = new Date().toISOString();
    const {error} = await sb.from('plaques').update(payload).eq('id', id);
    if(error){ toast('Não foi possível salvar as alterações.', 'error'); return false; }
    await loadAppData();
    toast('Plaquinha atualizada com sucesso.', 'success');
    location.hash = '#/plaquinhas/'+id;
    render();
  } else {
    payload.unique_code = genCode();
    payload.status = 'ativa';
    const {data, error} = await sb.from('plaques').insert(payload).select().single();
    if(error){ toast('Não foi possível cadastrar a plaquinha.', 'error'); return false; }
    await loadAppData();
    location.hash = '#/plaquinhas/'+data.id;
    render();
    toast('Plaquinha cadastrada! Código ' + data.unique_code, 'success');
  }
  return false;
}

function renderPlaqueDetail(id){

  if(currentUser.role==='vendedor' && p.sellerId !== currentUser.sellerId){ location.hash='#/plaquinhas'; return render(); }

  const scans = plaqueScans(id).sort((a,b)=>new Date(b.scannedAt)-new Date(a.scannedAt));
  const today = scans.filter(s=>isToday(s.scannedAt)).length;
  const d7 = scans.filter(s=>isWithinDays(s.scannedAt,7)).length;
  const d30 = scans.filter(s=>isWithinDays(s.scannedAt,30)).length;

  const url = dynamicUrl(p.uniqueCode);

  const body = `

        <button class="btn ${p.status==='ativa'?'btn-danger-ghost':'btn-accent'}" onclick="confirmToggleStatus('${p.id}')">${iconSvg('power')} ${p.status==='ativa'?'Desativar':'Ativar'}</button>
        <button class="btn btn-danger-ghost btn-icon" title="Excluir" onclick="confirmDeletePlaque('${p.id}')">${iconSvg('trash')}</button>
      </div>
    </div>

    <div class="detail-grid">
      <div class="card qr-box">
        <img src="${qrImg}" alt="QR Code da plaquinha ${p.uniqueCode}">
        <div class="url-line"><span style="flex:1;">${url}</span></div>
        <div class="qr-actions">
          <button class="btn btn-ghost btn-sm" onclick="copyPlaqueUrl('${p.uniqueCode}')">${iconSvg('copy')} Copiar URL</button>
          <a class="btn btn-ghost btn-sm" href="#/r/${p.uniqueCode}" target="_self">${iconSvg('external')} Testar QR</a>
          <button class="btn btn-ghost btn-sm" onclick="downloadQr('${p.uniqueCode}','png')">Baixar PNG</button>
          <button class="btn btn-ghost btn-sm" onclick="downloadQr('${p.uniqueCode}','svg')">Baixar SVG</button>
        </div>
      </div>

      <div>
        <div class="kpi-row">
          <div class="kpi"><div class="n">${scans.length}</div><div class="l">Total de acessos</div></div>
          <div class="kpi"><div class="n">${today}</div><div class="l">Hoje</div></div>
          <div class="kpi"><div class="n">${d7}</div><div class="l">Últimos 7 dias</div></div>
          <div class="kpi"><div class="n">${d30}</div><div class="l">Últimos 30 dias</div></div>
        </div>
        <div class="card panel">
          <h3>Acessos (últimos 30 dias)</h3>
          <div class="panel-sub">Último acesso: ${last}</div>
          <div class="bars">
            ${days.map(x => `<div class="bar-col"><div class="bar" style="height:${Math.max(4,(x.count/max)*130)}px" title="${x.count} acessos"></div><div class="bar-lbl">${x.d.getDate()}/${x.d.getMonth()+1}</div></div>`).join('')}
          </div>
        </div>
        <div class="card panel" style="margin-bottom:0;">
          <h3>Detalhes</h3>
          <div class="panel-sub">Informações cadastradas</div>
          <div class="info-list">
            <div class="info-item"><div class="lbl">TIPO DE PRODUTO</div><div class="val">${escapeHtml(p.productType)}</div></div>
            <div class="info-item"><div class="lbl">TIPO DE DESTINO</div><div class="val">${destTypeLabel(p.destinationType)}</div></div>
            <div class="info-item" style="grid-column:1/-1;"><div class="lbl">LINK ATUAL</div><div class="val" style="word-break:break-all;">${escapeHtml(p.destinationUrl)}</div></div>
            <div class="info-item" style="grid-column:1/-1;"><div class="lbl">OBSERVAÇÕES</div><div class="val">${p.notes ? escapeHtml(p.notes) : '—'}</div></div>
          </div>
        </div>
      </div>
    </div>
  `;
  mountPage('plaquinhas', escapeHtml(p.businessName), 'Plaquinhas', body);
}
async function downloadQr(code, format){
  const url = dynamicUrl(code);
  if(format === 'png'){
    try{
      const resp = await fetch(QR_API + encodeURIComponent(url));
      const blob = await resp.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'qrcode-'+code+'.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }catch(e){ toast('Não foi possível baixar o PNG agora.', 'error'); }
  } else {
    // wrapper SVG contendo a imagem do QR (compatível com o formato de arquivo, mantém a mesma URL codificada)
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
      <rect width="320" height="320" fill="#ffffff"/>
      <image href="${QR_API + encodeURIComponent(url)}" x="0" y="0" width="320" height="320"/>
    </svg>`;
    const blob = new Blob([svg], {type:'image/svg+xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qrcode-'+code+'.svg';
    a.click();
    URL.revokeObjectURL(a.href);
  }
}

    p_code: code,
    p_user_agent: navigator.userAgent,
    p_referrer: document.referrer || '',

    document.getElementById('app').innerHTML = `
      <div class="public-wrap"><div class="public-card">
        <div class="public-icon" style="background:var(--amber-100);">${iconSvg('power').replace(/currentColor/g,'#B6790A')}</div>
        <h2 style="margin:0 0 8px;">QR Code temporariamente desativado</h2>
        <p style="color:var(--ink-600);font-size:14px;">Esta plaquinha está inativa no momento. Entre em contato com o responsável pelo estabelecimento.</p>
      </div></div>`;
    return;
  }

  document.getElementById('app').innerHTML = `
    <div class="public-wrap"><div class="public-card">
      <div class="spinner"></div>
      <h2 style="margin:0 0 8px;">Redirecionando…</h2>
      <p style="color:var(--ink-600);font-size:14px;">Você será levado para o destino configurado por <b>${escapeHtml(data.business_name)}</b>.</p>
      <a class="btn btn-primary" style="width:100%;margin-top:10px;" href="${data.destination_url}">Continuar agora</a>
    </div></div>`;

  setTimeout(() => { window.location.href = data.destination_url; }, 900);
}

/* ============================== INIT ============================== */
boot();
</script>
</body>
</html>
